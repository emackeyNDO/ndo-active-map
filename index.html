<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NDO Active Customers &mdash; Snapshot (July 10, 2026)</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --ink:#e8edf2; --muted:#8a94a6; --accent:#58a6ff; --card:rgba(20,26,38,.90); }
  html,body { margin:0; height:100%; background:#1b2230; overflow:hidden;
    overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #map { position:fixed; inset:0; height:100vh; height:100dvh; touch-action:none; }
  .panel { position:absolute; top:max(14px, env(safe-area-inset-top)); left:14px; z-index:5;
    background:var(--card); color:var(--ink); border:1px solid rgba(255,255,255,.10);
    border-radius:12px; padding:14px 16px; backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:260px; }
  .panel h1 { margin:0 0 2px; font-size:15px; font-weight:650; letter-spacing:.2px; }
  .panel .sub { color:var(--muted); font-size:12px; }
  .panel .snap { color:var(--muted); font-size:11px; margin-top:3px; }
  .panel .snap b { color:var(--accent); font-weight:650; }
  .panel .count { color:var(--accent); font-weight:700; }
  .legend { margin-top:11px; display:flex; align-items:center; gap:8px;
    color:var(--muted); font-size:11.5px; }
  .legend .dot { width:13px; height:13px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg); background:var(--accent); display:inline-block;
    border:1.5px solid #0b1730; flex:0 0 auto; }
  .maplibregl-popup { max-width:min(320px, 90vw) !important; }
  .maplibregl-popup-content { background:var(--card); color:var(--ink);
    border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:0;
    backdrop-filter:blur(8px); box-shadow:0 10px 34px rgba(0,0,0,.55);
    overflow:hidden; font-size:12.5px; }
  .maplibregl-popup-close-button { color:var(--muted); font-size:22px;
    width:34px; height:34px; line-height:30px; padding:0; }
  .maplibregl-popup-tip { display:none; }
  @media (pointer: coarse) { .maplibregl-ctrl-group button { width:40px; height:40px; } }
  @media (max-width: 600px) {
    .panel { top:max(10px, env(safe-area-inset-top)); left:10px; right:10px;
      max-width:none; padding:10px 12px; }
    .panel h1 { font-size:14px; }
    .panel .sub { font-size:11.5px; }
    .legend { margin-top:8px; font-size:11px; }
  }
  .pop-h { padding:12px 14px 10px; border-bottom:1px solid rgba(255,255,255,.08); }
  .pop-h .nm { font-size:14px; font-weight:650; line-height:1.25; }
  .pop-h .ad { color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.3; }
  .pop-stats { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(255,255,255,.07); }
  .pop-stats .s { background:var(--card); padding:9px 14px; }
  .pop-stats .s .k { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .pop-stats .s .v { font-size:14px; font-weight:650; margin-top:2px; }
  .pop-stats .s .v.accent { color:var(--accent); }
  .pop-meta { padding:10px 14px 12px; display:grid; gap:5px; }
  .pop-meta .row { display:flex; justify-content:space-between; gap:12px; }
  .pop-meta .row .k { color:var(--muted); font-size:11px; }
  .pop-meta .row .val { font-size:11.5px; text-align:right; }
  /* ---- password gate ---- */
  #gate { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1100px 760px at 50% -12%, #26314a, #10151f 62%); padding:20px; }
  .gate-card { width:100%; max-width:340px; background:var(--card); color:var(--ink);
    border:1px solid rgba(255,255,255,.10); border-radius:16px; padding:26px 24px 22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55); text-align:center; }
  .gate-card .mark { width:46px; height:46px; margin:0 auto 14px; display:block; }
  .gate-card h1 { margin:0 0 4px; font-size:18px; font-weight:680; letter-spacing:.2px; }
  .gate-card .snap { color:var(--muted); font-size:12.5px; margin-bottom:20px; }
  .gate-card .snap b { color:var(--accent); font-weight:650; }
  .gate-row { display:flex; gap:8px; }
  .gate-card input { flex:1; min-width:0; background:#0d131e; border:1px solid rgba(255,255,255,.14);
    color:var(--ink); border-radius:10px; padding:11px 13px; font-size:15px; outline:none; }
  .gate-card input:focus { border-color:var(--accent); }
  .gate-card button { background:var(--accent); color:#06132a; border:0; border-radius:10px;
    padding:11px 16px; font-size:14px; font-weight:680; cursor:pointer; white-space:nowrap; }
  .gate-card button:disabled { opacity:.6; cursor:default; }
  .gate-err { color:#ff6b6b; font-size:12px; min-height:16px; margin-top:12px; }
  .gate-note { color:#6b7482; font-size:10.5px; margin-top:12px; line-height:1.4; }
</style>
</head>

// ---- password gate: decrypt the data payload with a PBKDF2/AES-GCM key ----
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptData(password) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const gate = document.getElementById('gate');
const pwInput = document.getElementById('pw');
const pwErr = document.getElementById('pwerr');
const pwBtn = document.getElementById('pwbtn');
let booted = false;

async function tryUnlock() {
  if (!(window.crypto && crypto.subtle)) {
    pwErr.textContent = 'Secure context required — open this page over https.';
    return;
  }
  pwErr.textContent = '';
  pwBtn.disabled = true; pwBtn.textContent = 'Unlocking…';
  try {
    const data = await decryptData(pwInput.value);
    gate.style.display = 'none';
    if (!booted) { booted = true; boot(data); }
  } catch (e) {
    pwErr.textContent = 'Incorrect password.';
    pwBtn.disabled = false; pwBtn.textContent = 'Unlock';
    pwInput.select();
  }
}
pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
window.addEventListener('load', () => pwInput.focus());

// ---- map (built only after a correct password) ----
function boot(DATA) {
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [-97.5, 39.2],
    zoom: COARSE ? 3.2 : 3.7,
    attributionControl: true,
    dragRotate: false, pitchWithRotate: false, touchPitch: false,
    clickTolerance: COARSE ? 5 : 3,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');

  const C = {
    land:'#1b2230', water:'#0b1018', park:'#16321f', admin:'#2a3242',
    stateLine:'#525f7a', countryLine:'#5c6a86',
    road:'#323b4d', hwy:'#3d4860', casing:'#0d1117', rail:'#2a3242',
    text:'#8a94a6', textHalo:'#0d1117', waterText:'#3d4860',
  };
  const LABEL_MAX_ON_SCREEN = 100;

  const setText = (id, color) => {
    try { map.setPaintProperty(id, 'text-color', color); } catch(e){}
    try { map.setPaintProperty(id, 'text-halo-color', C.textHalo); } catch(e){}
    try { map.setPaintProperty(id, 'text-halo-width', 1.2); } catch(e){}
  };

  function styleSmartDoor() {
    for (const l of map.getStyle().layers) {
      const id = l.id, sl = l['source-layer'] || '', t = l.type;
      if (t === 'background') { map.setPaintProperty(id, 'background-color', C.land); continue; }
      if (sl === 'building' || sl === 'poi' || sl === 'housenumber' || sl === 'transportation_name') {
        try { map.setLayoutProperty(id, 'visibility', 'none'); } catch(e){}
        continue;
      }
      if (t === 'fill') {
        map.setPaintProperty(id, 'fill-color', sl === 'water' ? C.water : sl === 'park' ? C.park : C.land);
      } else if (t === 'line') {
        let c;
        if (sl === 'waterway') c = C.water;
        else if (sl === 'boundary') c = id.includes('state') ? C.stateLine
          : id.includes('country') ? C.countryLine : C.admin;
        else if (sl === 'aeroway') c = C.road;
        else if (id.indexOf('rail') === 0) c = C.rail;
        else if (id.includes('_case')) c = C.casing;
        else c = (id.includes('mot') || id.includes('trunk')) ? C.hwy : C.road;
        map.setPaintProperty(id, 'line-color', c);
      } else if (t === 'symbol') {
        setText(id, sl === 'water_name' ? C.waterText : C.text);
      }
    }
  }

  const PIN = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="72" viewBox="0 0 24 36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"
          fill="#58a6ff" stroke="#000" stroke-opacity="0.92" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="4.5" fill="#fff"/>
  </svg>`;

  function addAccounts() {
    const base = COARSE ? 0.82 : 0.62;
    // Pins grow with zoom so they're easier to tap/click when zoomed in.
    const iconSize = ['interpolate', ['linear'], ['zoom'],
      3, base * 0.8, 9, base, 14, base * 1.3, 17, base * 1.65];
    map.addSource('accounts', { type: 'geojson', data: DATA, generateId: true });
    map.addLayer({
      id: 'accounts',
      type: 'symbol',
      source: 'accounts',
      layout: {
        'icon-image': 'pin',
        'icon-size': iconSize,
        'icon-anchor': 'bottom',
        'icon-allow-overlap': true,
        'text-field': '',
        'text-font': ['Open Sans Regular'],
        'text-size': COARSE ? 13 : 12,
        'text-variable-anchor': ['right', 'left', 'top', 'bottom'],
        'text-radial-offset': 0.9,
        'text-justify': 'auto',
        'text-optional': true,
        'text-allow-overlap': false,
        'text-padding': 4,
        'text-max-width': 11,
      },
      paint: {
        'text-color': '#58a6ff',
        'text-halo-color': '#000000',
        'text-halo-width': 1.6,
        'text-halo-blur': 0.3,
      },
    });
  }

  let labelsShown = null;
  function updateLabels() {
    if (!map.getLayer('accounts')) return;
    const ids = new Set(map.queryRenderedFeatures({ layers: ['accounts'] }).map(f => f.id));
    const show = ids.size <= LABEL_MAX_ON_SCREEN;
    if (show === labelsShown) return;
    labelsShown = show;
    map.setLayoutProperty('accounts', 'text-field', show ? ['get', 'name'] : '');
  }

  const fmt = v => (v === undefined || v === null || v === '') ? '&mdash;' : v;

  map.on('click', 'accounts', (e) => {
    const p = e.features[0].properties;
    const c = e.features[0].geometry.coordinates.slice();
    const meta = [];
    if (p.distributor) meta.push(['Distributor', p.distributor]);
    if (p.channel)     meta.push(['Channel', p.channel]);
    if (p.rep)         meta.push(['Sales rep', p.rep]);
    const metaHtml = meta.map(m =>
      `<div class="row"><span class="k">${m[0]}</span><span class="val">${fmt(m[1])}</span></div>`).join('');
    const html = `
      <div class="pop-h">
        <div class="nm">${p.name}</div>
        ${p.address ? `<div class="ad">${p.address}</div>` : ''}
      </div>
      <div class="pop-stats">
        <div class="s"><div class="k">Lifetime spend</div><div class="v accent">${fmt(p.spend)}</div></div>
        <div class="s"><div class="k">Orders</div><div class="v">${fmt(p.orders)}</div></div>
        <div class="s"><div class="k">Cans</div><div class="v">${fmt(p.cans)}</div></div>
        <div class="s"><div class="k">Total units</div><div class="v">${fmt(p.units)}</div></div>
      </div>
      <div class="pop-meta">
        <div class="row"><span class="k">First order</span><span class="val">${fmt(p.first)}</span></div>
        <div class="row"><span class="k">Last order</span><span class="val">${fmt(p.last)}</span></div>
        ${metaHtml}
      </div>`;
    new maplibregl.Popup({ closeButton: true, offset: COARSE ? 40 : 30, maxWidth: 'min(320px, 90vw)' })
      .setLngLat(c).setHTML(html).addTo(map);
    if (COARSE) map.easeTo({ center: c, offset: [0, 90], duration: 300 });
  });

  map.on('mouseenter', 'accounts', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'accounts', () => map.getCanvas().style.cursor = '');

  map.on('load', () => {
    styleSmartDoor();
    const img = new Image(48, 72);
    img.onload = () => {
      if (!map.hasImage('pin')) map.addImage('pin', img, { pixelRatio: 2 });
      addAccounts();
      map.on('idle', updateLabels);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(PIN);
  });
}
</script>
